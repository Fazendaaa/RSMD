name: RSMD CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: docker.io
  IMAGE_NAME: fazenda/rsmd
  GITOPS_REPO: fazendaaa/rsmd

jobs:
  test-r-package:
    name: Test R Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.3.2

      - name: Install R Dependencies
        run: |
          install.packages(c("devtools", "testthat", "spelling", "goodpractice"))
        shell: Rscript {0}

      - name: Run R Checks and Tests
        run: |
          Rscript -e 'devtools::check()'
          Rscript -e 'devtools::test()'
        shell: bash

  build-and-push:
    name: Build and Push Docker Image
    needs: test-r-package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update GitOps Repository
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update Image Tag in GitOps values.yaml
        run: |
          cd gitops/apps/rsmd

          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          sed -i "s/tag: .*/tag: \"sha-${SHORT_SHA}\"/g" values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git commit -m "chore(rsmd): deploy commit sha-${SHORT_SHA} [skip ci]"
          git push
