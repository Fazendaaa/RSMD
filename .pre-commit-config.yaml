# AUTO-GENERATED BY estat-cli. DO NOT EDIT MANUALLY.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
    args:
    - --maxkb=500
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: detect-private-key
  - id: mixed-line-ending
    args:
    - --fix=lf
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.25.1
  hooks:
  - id: gitleaks
- repo: https://github.com/crate-ci/typos
  rev: v1.29.4
  hooks:
  - id: typos
    exclude: .*\.excalidraw$
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - feat
    - fix
    - chore
    - docs
    - refactor
    - test
    - ci
    - build
- repo: https://github.com/lorenzwalthert/precommit
  rev: v0.4.2
  hooks:
  - id: style-files
  - id: lintr
- repo: local
  hooks:
  - id: check-stale-precommit
    name: Check for stale managed files
    entry: estat hook check-stale-precommit
    language: system
    pass_filenames: false
    always_run: true
  - id: ban-r-antipatterns
    name: Ban R anti-patterns (library, require, :::, <<-)
    entry: estat hook ban-r-antipatterns
    language: system
    files: \.[rR]$
    pass_filenames: true
  - id: ban-r-self-import
    name: Ban package from importing itself
    entry: estat hook ban-r-self-import
    language: system
    files: \.[rR]$|DESCRIPTION$
    pass_filenames: true
  - id: r-lintr-docker
    name: R lintr (via Docker for deep semantic analysis)
    entry: estat hook r-lintr-docker
    language: system
    files: \.[rR]$
    pass_filenames: true
    require_serial: true
